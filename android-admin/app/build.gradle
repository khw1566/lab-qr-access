plugins {
    id 'com.android.application'
}

android {
    namespace 'com.audreaming.labadmin'
    compileSdk 36

    defaultConfig {
        applicationId 'com.audreaming.labadmin'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 따로 서명 키를 만들기 전까지는 디버그 키로 서명한다 (설치·업데이트용)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
}
