gin:60px auto;width:860px;text-align:left;position:relative}.pin h2{font-size:35px}.pin p{font-size:20px;margin-top:8px}.pin input{display:block;margin:22px 0 16px;width:260px;font:36px 'Arial';text-align:center;letter-spacing:20px;padding:12px;border:2px solid var(--line);border-radius:10px;color:var(--ink);background:var(--paper)}.keypad{position:absolute;right:0;top:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:330px;margin:auto}.keypad button{height:57px;background:var(--soft);color:var(--ink);border:0;border-radius:8px;font-size:24px}.pin .pinmsg{font-size:18px;min-height:28px}.screen svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.meta{margin-top:13px;display:flex;gap:18px;font-size:13px;color:#526174;line-height:1.7}.meta b{color:#263953}.swatches{display:flex;gap:5px;align-items:center;flex-shrink:0}.swatches i{display:block;width:15px;height:15px;border-radius:50%}.note{font-size:13px;line-height:1.8;color:#526174;margin:20px 0}body.capture{background:transparent}body.capture header,body.capture .caption,body.capture .meta,body.capture .note{display:none}body.capture main{max-width:none;padding:0}body.capture .proposal{margin:0}body.capture .viewport{border-radius:0;box-shadow:none;width:1024px;height:600px}body.capture .proposal[hidden]{display:none}@media(max-width:720px){header{margin-top:24px}.caption{display:block}.caption p{margin-top:8px}.meta{flex-wrap:wrap}.proposal{margin-bottom:30px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<header><h1>실습실 출입 단말, 세 가지 방향</h1><p>7인치 · 1024 × 600 기준. 화면 상태를 바꿔 보거나 시안 안의 버튼을 눌러 비교하세요.</p><nav aria-label="비교할 화면 상태"></nav></header>
<main id="concepts"></main>
<script>
const icons={qr:'<svg class="qrmark" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 3h12v12H3zM25 3h12v12H25zM3 25h12v12H3zM8 8h2v2H8zM30 8h2v2h-2zM8 30h2v2H8zM21 21h6v6h-6zM32 21h5v10h-5zM21 32h6v5h-6zM32 36h5M19 3v7M3 20h8M16 20h4M20 14v3M15 29h3"/></svg>',entry:'<svg class="entryicon" viewBox="0 0 80 80" aria-hidden="true"><path d="M15 12h20v20H15zM45 12h20v20H45zM15 42h20v20H15zM45 42h8v8h-8zM60 43h5v19H45v-5M9 4H4v14M70 4h6v14M4 60v14h14M76 60v14H62"/></svg>',check:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="m10 24 9 9 19-20" stroke-width="4"/></svg>',denied:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="m15 15 18 18M33 15 15 33" stroke-width="4"/></svg>',offline:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="m7 7 34 34M10 18a24 24 0 0 1 29 0M15 26a16 16 0 0 1 14-3M21 33h4M24 40h.1" stroke-width="3"/></svg>'};
const designs=[{id:'a',name:'A · 캠퍼스 라이트',desc:'차분한 청록색과 여백. 밝은 복도에 어울리는 기본안.',colors:['#f6f9fb','#18354b','#087b80','#e2f1f1'],detail:'시간과 출입 동작을 좌우로 분리 · 큰 버튼 · 부드러운 모서리'}, {id:'b',name:'B · 나이트 스캐너',desc:'네이비 바탕과 선명한 스캔 프레임. 단말다운 인상.',colors:['#15263e','#f1f5fb','#8bc7ff','#243f60'],detail:'카메라를 왼쪽에 배치 · 오른쪽에 짧은 안내 · 중앙 정렬 결과'}, {id:'c',name:'C · 블루 웨이파인딩',desc:'멀리서도 읽히는 큰 문구. 공공 키오스크 같은 명확함.',colors:['#ffffff','#142979','#2447db','#edf1ff'],detail:'파란 상단 바 · 큰 글자와 넓은 버튼 · 결과를 굵은 세로선으로 강조'}];
const states=[['home','대기'],['scan','QR 인식'],['granted','출입 승인'],['denied','출입 거부'],['offline','연결 끊김'],['guide','이용안내'],['settings','관리자 설정']];
const root=document.getElementById('concepts');
document.querySelector('nav').innerHTML=states.map(([id,name])=>`<button type="button" data-all="${id}" aria-pressed="${id==='home'}">${name}</button>`).join('');
root.innerHTML=designs.map(d=>`<section class="proposal" data-design="${d.id}"><div class="caption"><h2>${d.name}</h2><p>${d.desc}</p></div><div class="viewport"><div class="screen ${d.id}" data-state="home" aria-label="${d.name} 화면 시안"></div></div><div class="meta"><div class="swatches" aria-label="색상 팔레트">${d.colors.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('')}</div><span>${d.detail}</span></div></section>`).join('')+'<p class="note">디자인 검토용 시안입니다. 시각은 예시이며 카메라는 안내 그림으로 표시했습니다. 이용안내의 QR 그림은 스캔할 수 없습니다. 실제 펌웨어와 도어락은 연결하지 않았습니다.</p>';
function buildTop(){return '<div class="top"><div class="identity"><span class="brand" aria-hidden="true"><i></i><i></i><i></i><i></i></span>실습실 출입</div><div class="status"><span class="dot"></span>출입 서비스 연결됨</div></div>'}
function footer(state){return `<div class="foot">${state==='home'?'<button class="plain" data-go="guide">처음 이용하시나요? 이용안내</button>':'<button class="plain" data-go="home">‹ 메인으로</button>'}<button class="plain" data-go="settings">관리자 설정</button></div>`}
function render(screen,state){screen.dataset.state=state;let body='';if(state==='home'){body=`<div class="homecopy"><div class="time">09:41</div><div class="date">2026년 11월 3일 화요일</div><h2>${screen.classList.contains('a')?'출입증을 준비해 주세요':'출입증을<br>준비해 주세요'}</h2><p>승인된 출입증의 QR코드로 입장하세요.</p></div><div class="homeaction">${icons.entry}<button class="primary" data-go="scan">QR 출입 시작</button><span>휴대폰에서 출입증을 열어 주세요</span></div>`}else if(state==='scan'){body=`<div class="scancopy"><h2>QR코드를<br>사각형에 맞춰 주세요</h2><p>휴대폰의 출입증 화면을<br>카메라에 보여 주세요.</p><div class="scansteps"><b>1</b>출입증 열기 <b>2</b>QR코드 보여주기</div></div><div class="scanbox"><div class="camera"><div class="phone">${icons.qr}</div></div></div><div class="scanlabel">카메라 미리보기 영역</div>`}else if(['granted','denied','offline'].includes(state)){const data={granted:['check','--ok','출입이 승인되었습니다','문이 열립니다. 입장해 주세요.','잠시 후 대기 화면으로 돌아갑니다.'],denied:['denied','--bad','출입이 거부되었습니다','휴대폰에서 출입증의 승인 상태를 확인해 주세요.','문이 열리지 않습니다. 도움이 필요하면 관리자에게 문의하세요.'],offline:['offline','--warning','서버에 연결할 수 없습니다','잠시 후 QR코드를 다시 보여 주세요.','연결이 복구되기 전에는 문이 열리지 않습니다.']}[state];body=`<div class="result" style="--result:var(${data[1]})"><div class="resulticon">${icons[data[0]]}</div><div><h2>${data[2]}</h2><p>${data[3]}</p><small>${data[4]}</small></div></div>`}else if(state==='guide'){body=`<div class="guide"><div><div class="guideqr">${icons.qr}</div><div class="guideurl">lab.audreaming.com</div><div class="guide-note">QR은 배치 확인을 위한 예시 그림입니다.</div></div><div><h2>처음 이용하시나요?</h2><ol><li>휴대폰으로 이용 사이트에 접속</li><li>가입 후 실습실 이용 신청</li><li>승인된 출입증의 QR코드 열기</li><li>단말 카메라에 QR코드 보여주기</li></ol></div></div>`}else{body=`<div class="pin"><h2>관리자 설정</h2><p>관리자 PIN을 입력해 주세요.</p><input aria-label="관리자 PIN" type="password" inputmode="numeric" maxlength="6" readonly><div class="keypad">${['1','2','3','4','5','6','7','8','9','지움','0','확인'].map(x=>`<button data-key="${x}">${x}</button>`).join('')}</div><div class="pinmsg" aria-live="polite"></div></div>`}screen.innerHTML=buildTop()+body+footer(state);if(state==='offline'){const status=screen.querySelector('.status');status.innerHTML='<span class="dot" style="background:var(--warning)"></span>서버 연결 확인 필요'}screen.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>render(screen,b.dataset.go)));screen.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{const input=screen.querySelector('input');if(b.dataset.key==='지움')input.value=input.value.slice(0,-1);else if(b.dataset.key==='확인')screen.querySelector('.pinmsg').textContent='설정 화면의 디자인 예시입니다.';else if(input.value.length<6)input.value+=b.dataset.key}));}
const screens=[...document.querySelectorAll('.screen')];screens.forEach(s=>render(s,'home'));
document.querySelectorAll('[data-all]').forEach(button=>button.addEventListener('click',()=>{screens.forEach(s=>render(s,button.dataset.all));document.querySelectorAll('[data-all]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
function fit(){document.querySelectorAll('.viewport').forEach(v=>v.querySelector('.screen').style.transform=`scale(${v.clientWidth/1024})`)}new ResizeObserver(fit).observe(root);fit();
const params=new URLSearchParams(location.search);if(params.has('capture')){document.body.classList.add('capture');document.querySelectorAll('.proposal').forEach(p=>p.hidden=p.dataset.design!==params.get('capture'));screens.forEach(s=>render(s,params.get('state')||'home'));fit()}
</script>
</html>
