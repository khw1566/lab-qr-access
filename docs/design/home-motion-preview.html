<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출입단말 · 로고 그래픽</title>
<style>
@font-face{font-family:Lab;src:url('../../firmware/third_party/nanum-gothic/NanumGothic-Regular.ttf');font-weight:400}
@font-face{font-family:Lab;src:url('../../firmware/third_party/nanum-gothic/NanumGothic-Bold.ttf');font-weight:700}
*{box-sizing:border-box}
body{margin:0;background:#e7edf3;font-family:Lab,sans-serif;color:#000}
.wrap{max-width:1064px;margin:30px auto;padding:20px}
.viewport{position:relative;aspect-ratio:1024/600;background:#fff;overflow:hidden;box-shadow:0 14px 40px #13375422}
.screen{width:1024px;height:600px;position:absolute;transform-origin:top left;background:white}
.bar{height:92px;background:#0070c0;position:relative}
.brand{position:absolute;left:16px;top:22px;display:grid;grid-template-columns:20px 20px;gap:6px}
.brand i{width:20px;height:20px;border-radius:3px;background:#fff}.brand i:last-child{opacity:.5}
.title{color:white;position:absolute;left:82px;top:22px;font-size:40px;line-height:1;font-weight:700}
.clock{position:absolute;left:588px;top:7px;width:196px;text-align:center;font-size:64px;font-weight:700;line-height:1;color:black}
.date{position:absolute;left:792px;top:50px;font-size:28px;line-height:1;color:black;font-weight:700}
.headline{position:absolute;left:36px;top:132px;width:640px;font-size:64px;line-height:1.04;font-weight:700;margin:0}
.entry,.guide,.manual{position:absolute;display:flex;align-items:center;font-weight:700;border:0;font-family:inherit;cursor:pointer}
.entry{left:36px;top:318px;width:640px;height:148px;background:#0070c0;font-size:64px;gap:34px;padding-left:32px;color:#fff}
.entry img{width:80px;height:80px;filter:invert(1)}
.guide{left:36px;top:488px;width:480px;height:88px;background:#adadad;font-size:40px;gap:20px;padding-left:20px;color:#fff}
.guide img{width:56px;height:56px;filter:invert(1)}
.manual{left:544px;top:488px;width:340px;height:88px;background:#eef3f7;font-size:28px;gap:16px;padding-left:24px;border-radius:8px}
.manual img{width:44px;height:44px}
.settings{position:absolute;left:936px;top:514px;width:64px;height:64px}
.wifi{position:absolute;left:992px;top:10px;width:20px;height:20px}
.logo-art{position:absolute;left:684px;top:168px;width:332px;height:332px;pointer-events:none}
p{font-size:13px;color:#53657a;margin:14px 0 0;line-height:1.7}
</style>
<div class="wrap">
  <div class="viewport"><div class="screen">
    <div class="bar">
      <div class="brand"><i></i><i></i><i></i><i></i></div>
      <span class="title">실습실 출입단말</span><span class="clock">12:58</span><span class="date">11월 3일 화요일</span>
      <img class="wifi" alt="" src="../../firmware/assets/source/wifi.png">
    </div>
    <h1 class="headline">모바일 QR출입증을<br>준비해주세요</h1>
    <canvas class="logo-art" width="664" height="664" role="img" aria-label="원본 로고 테두리에서 물결이 바깥으로 퍼지는 작동 표시"></canvas>
    <button class="entry"><img alt="" src="../../firmware/assets/source/fingerprint.png">QR 출입</button>
    <button class="guide"><img alt="" src="../../firmware/assets/source/circle-help.png">처음 이용하시나요?</button>
    <button class="manual"><img alt="" src="../../firmware/assets/source/keyboard.png">코드 입력</button>
    <img class="settings" alt="설정" src="../../firmware/assets/source/settings.png">
  </div></div>
  <p>PC 디자인 미리보기 · 실제 LCD 캡처가 아닙니다.</p>
</div>
<script>
const screen=document.querySelector('.screen'),viewport=document.querySelector('.viewport');
new ResizeObserver(()=>screen.style.transform=`scale(${viewport.clientWidth/1024})`).observe(viewport);
const canvas=document.querySelector('.logo-art'),ctx=canvas.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const logo=new Image();logo.src='../../firmware/assets/source/logo-art.png';
let contours,frame=0,last=0;
function draw(){
  ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,332,332);
  ctx.lineWidth=1;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#005767';
  for(let wave=0;wave<3;wave++){
    const age=(frame+Math.floor(wave*100/3))%100,radius=Math.floor(age*46/99);
    const opacity=Math.floor(100*Math.min(100,age*10)*(99-age)/(100*99));
    if(!opacity)continue;
    ctx.globalAlpha=opacity/255;ctx.beginPath();
    contours[radius].forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.closePath();ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.drawImage(logo,0,0,332,332);
  canvas.dataset.frame=String(frame);
}
function animate(time){
  if(time-last>=50){last=time;if(!reduce.matches)frame=(frame+1)%100;draw();}
  requestAnimationFrame(animate);
}
Promise.all([logo.decode(),fetch('../../firmware/assets/source/logo-ripples.json').then(r=>r.json())])
  .then(([,paths])=>{contours=paths;draw();requestAnimationFrame(animate)});
</script>
</html>
