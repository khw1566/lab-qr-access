*{box-sizing:border-box}body{margin:0;background:#e7edf3;font-family:Lab,sans-serif;color:#000}.wrap{max-width:1064px;margin:30px auto;padding:20px}.viewport{position:relative;aspect-ratio:1024/600;background:#fff;overflow:hidden;box-shadow:0 14px 40px #13375422}.screen{width:1024px;height:600px;position:absolute;transform-origin:top left;background:white}.bar{height:92px;background:#0070c0;position:relative}.brand{position:absolute;left:16px;top:22px;display:grid;grid-template-columns:20px 20px;gap:6px}.brand i{width:20px;height:20px;border-radius:3px;background:#fff}.brand i:last-child{opacity:.5}.title{color:white;position:absolute;left:82px;top:22px;font-size:40px;line-height:1;font-weight:700}.clock{position:absolute;left:588px;top:7px;width:196px;text-align:center;font-size:64px;font-weight:700;line-height:1;color:black}.date{position:absolute;left:792px;top:50px;font-size:28px;line-height:1;color:black;font-weight:700}.headline{position:absolute;left:36px;top:132px;width:640px;font-size:64px;line-height:1.04;font-weight:700;margin:0}.entry,.guide{position:absolute;display:flex;align-items:center;color:#fff;font-weight:700}.entry{left:36px;top:318px;width:640px;height:148px;background:#0070c0;font-size:64px;gap:34px;padding-left:32px}.entry img{width:80px;height:80px;filter:invert(1)}.guide{left:36px;top:488px;width:480px;height:88px;background:#adadad;font-size:40px;gap:20px;padding-left:20px}.guide img{width:56px;height:56px;filter:invert(1)}.settings{position:absolute;left:936px;top:514px;width:64px;height:64px}.wifi{position:absolute;left:992px;top:10px;width:20px;height:20px}canvas{position:absolute;left:684px;top:168px;width:332px;height:332px}p{font-size:13px;color:#53657a;margin:14px 0 0;line-height:1.7}

<div class="wrap"><div class="viewport"><div class="screen"><div class="bar"><div class="brand"><i></i><i></i><i></i><i></i></div><span class="title">실습실 출입단말</span><span class="clock">12:58</span><span class="date">11월 3일 화요일</span><img class="wifi" alt="" src="../../firmware/assets/source/wifi.png"></div><h1 class="headline">모바일 QR출입증을<br>준비해주세요</h1><canvas width="664" height="664" aria-label="파란 선으로 된 입체 매듭이 회전하고 점들이 표면을 흐르는 생성형 아트"></canvas><div class="entry"><img alt="" src="../../firmware/assets/source/fingerprint.png">QR 출입</div><div class="guide"><img alt="" src="../../firmware/assets/source/circle-help.png">처음 이용하시나요?</div><img class="settings" alt="설정" src="../../firmware/assets/source/settings.png"></div></div><p>PC 디자인 미리보기 · 실제 LCD 캡처가 아닙니다.</p></div>
<script>
const screen=document.querySelector('.screen'),viewport=document.querySelector('.viewport');
new ResizeObserver(()=>screen.style.transform=`scale(${viewport.clientWidth/1024})`).observe(viewport);
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),size=332,TAU=Math.PI*2;
let phase=0,last=0;
function knot(t,strand){let band=(strand-3)*.055,tube=.48+band+.05*Math.sin(phase*.8+t*4),r=1.30+tube*Math.cos(3*t+phase*.35),x=r*Math.cos(2*t),y=r*Math.sin(2*t),z=tube*Math.sin(3*t+phase*.35),yaw=phase*.42,tilt=.65+.22*Math.sin(phase*.31),xx=x*Math.cos(yaw)+z*Math.sin(yaw),zz=-x*Math.sin(yaw)+z*Math.cos(yaw);return{x:xx,y:y*Math.cos(tilt)-zz*Math.sin(tilt),z:y*Math.sin(tilt)+zz*Math.cos(tilt)}}
function project(p){let s=size*.205*4.8/(4.8+p.z);return{x:size*.5+p.x*s,y:size*.5+p.y*s}}
function draw(t){if(t-last>=50){last=t;phase+=.035;ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,size,size);ctx.lineCap='round';for(let pass=0;pass<2;pass++){for(let strand=0;strand<7;strand++){let prev=knot(0,strand);for(let i=1;i<=80;i++){let curr=knot(TAU*i/80,strand),depth=(prev.z+curr.z)*.5;if((depth<0)===(pass===1)){let shade=Math.min(.92,Math.max(.12,(1-depth/2.2)*.5)),a=project(prev),b=project(curr);ctx.strokeStyle=`rgb(${255*(1-shade)},${255+(112-255)*shade},${255+(192-255)*shade})`;ctx.lineWidth=depth<0?2:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}prev=curr}}}for(let i=0;i<7;i++){let p=knot(phase*.45+TAU*i/7,3),a=project(p);ctx.fillStyle=p.z<0?'#0070c0':'#80b8e0';ctx.beginPath();ctx.arc(a.x,a.y,p.z<0?3:2,0,TAU);ctx.fill()}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
