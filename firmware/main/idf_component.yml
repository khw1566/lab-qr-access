## ESP-IDF 5.5 기준. 버전은 첫 빌드 때 `idf.py update-dependencies`로 확인/고정하세요.
dependencies:
  idf: ">=5.5"
  # ESP32-P4에는 Wi-Fi가 없으므로 보드의 ESP32-C6를 SDIO로 연결해 표준 esp_wifi API를 그대로 사용
  espressif/esp_wifi_remote: "*"
  espressif/esp_hosted: "*"
  # MIPI-CSI 카메라 + ISP를 V4L2 방식으로 다루는 드라이버 (센서 드라이버 esp_cam_sensor 포함)
  espressif/esp_video: "*"
